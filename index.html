<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的博客</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    .post-list a { display: block; margin: 8px 0; }
    #content { margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
  </style>
</head>
<body>
  <h1>我的博客</h1>
  <div class="post-list">
    <a href="#" onclick="loadPost('posts/2025-01-10-my-first-post.md')">我的第一篇文章</a>
    <a href="#" onclick="loadPost('posts/2025-01-15-hello-world.md')">Hello World</a>
  </div>
  <div id="content"></div>

  <script>
    async function loadPost(path) {
      const res = await fetch(path);
      const text = await res.text();
      // 去掉 Jekyll 的 front matter（如果存在）
      const body = text.replace(/^---[\s\S]*?---\n/, '');
      document.getElementById('content').innerHTML = marked.parse(body);
    }
  </script>
</body>
</html>
